services:
  sensor-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pruefung-2-sensor-api
    restart: always
    privileged: true
    ports:
      - "${HTTP_PORT:-5000}:5000"
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 5000
      MQTT_HOST: ${MQTT_HOST:-10.5.61.199}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-raspi/10/http/request}
      MQTT_STATUS_TOPIC: ${MQTT_STATUS_TOPIC:-raspi/10/up}
      I2C_BUS: ${I2C_BUS:-1}
      SENSOR_BACKEND: ${SENSOR_BACKEND:-hardware}
    devices:
      - /dev/gpiomem:/dev/gpiomem
      - /dev/i2c-${I2C_BUS:-1}:/dev/i2c-${I2C_BUS:-1}
